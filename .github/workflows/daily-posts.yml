name: Publish daily articles

on:
  schedule:
    # Four fallback times (UTC). The generator is idempotent per day — the
    # first run that succeeds publishes; later ones see the quota is met and
    # exit cleanly. GitHub's scheduler drops runs fairly often, so redundancy
    # is deliberate.
    #
    # Scheduled runs are also delayed when hosted runners are busy, and the
    # delay is not small: on 2026-08-06 the 14:00 slot waited 15 minutes for a
    # runner, was cancelled without ever starting, and the day was only saved
    # by the next slot executing at 01:51 UTC. A Phoenix day ends at 07:00 UTC,
    # so a slot that drifts past that publishes against the *following* day and
    # leaves a gap. The early slot exists to keep that margin wide.
    - cron: "0 14 * * *"   #  7am Phoenix
    - cron: "0 17 * * *"   # 10am Phoenix
    - cron: "0 20 * * *"   #  1pm Phoenix
    - cron: "0 23 * * *"   #  4pm Phoenix
  # Pushing a tag named backfill-* fills every recent day that is short on
  # posts. It exists because triggering workflow_dispatch needs an actions:write
  # token, while pushing a tag only needs contents:write — so a gap can be
  # closed from a clone without going through the Actions UI.
  push:
    tags:
      - "backfill-*"

  workflow_dispatch:
    inputs:
      backfill_dates:
        description: "Phoenix dates to backfill, comma-separated (YYYY-MM-DD). Empty = normal run for today."
        required: false
        default: ""
      posts_per_day:
        description: "Posts to write for each backfilled date"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Always work on main, never on a detached tag ref: a backfill-* tag push
      # would otherwise check out the tag and leave the commit step unable to
      # push, since HEAD would not be on a branch.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Cheap, no API cost, and it guards the angle de-duplication that keeps
      # the same topic from being published twice. Run before spending tokens.
      - name: Test angle selection
        run: npm test

      # Runs the whole publish path with a canned article instead of an API
      # call: angle selection, prompt assembly, rendering, index and sitemap.
      # Costs nothing and fails loudly. A ReferenceError reachable only on the
      # live path once killed publishing for three days while every local check
      # stayed green — this is the step that would have caught it.
      #
      # The dry run writes a real post, so put the tree back before the paid
      # run. Safe here and nowhere else: the checkout is fresh, so the only
      # untracked thing under blog/ is what the dry run just made.
      - name: Smoke-test the publish path
        run: |
          CPC_BLOG_DRYRUN=1 node scripts/generate-posts.mjs
          git checkout -- .
          git clean -fdq blog/
          git status --porcelain

      - name: Generate articles
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.backfill_dates == '')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CPC_POSTS_PER_RUN: "2"
        run: node scripts/generate-posts.mjs

      # Fills days the scheduler missed. Each date is generated as its own run
      # with CPC_BLOG_DATE set, so posts carry the date they should have had.
      # Safe to re-run: the generator counts posts already filed under a date
      # and skips one that is already full, so a repeat run is a no-op rather
      # than a duplicate.
      - name: Backfill missed days
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_dates != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CPC_POSTS_PER_RUN: ${{ inputs.posts_per_day }}
        run: |
          IFS=',' read -ra DATES <<< "${{ inputs.backfill_dates }}"
          for d in "${DATES[@]}"; do
            d="$(echo "$d" | tr -d '[:space:]')"
            [ -z "$d" ] && continue
            echo "::group::backfill $d"
            CPC_BLOG_DATE="$d" node scripts/generate-posts.mjs
            echo "::endgroup::"
          done

      # Same generation path as the dispatch backfill, but the dates are worked
      # out instead of typed. Re-running is a no-op: a day that already holds
      # its full quota is not reported as missing in the first place.
      - name: Backfill gaps (tag push)
        if: github.event_name == 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CPC_POSTS_PER_RUN: "2"
        run: |
          DATES="$(node scripts/missing-days.mjs 14)"
          if [ -z "$DATES" ]; then
            echo "No gaps in the last 14 days — nothing to backfill."
            exit 0
          fi
          echo "Filling: $DATES"
          for d in $DATES; do
            echo "::group::backfill $d"
            CPC_BLOG_DATE="$d" node scripts/generate-posts.mjs
            echo "::endgroup::"
          done

      - name: Commit and push
        run: |
          git config user.name  "ClearPath Content Bot"
          git config user.email "deploy@clearpath-content.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git add -A
          # Stamp the Phoenix date the posts are actually filed under. `date -u`
          # disagreed with it whenever a run landed after 17:00 Phoenix, which
          # made the git log misleading when auditing what published when.
          if [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "posts: backfill gaps (${GITHUB_REF_NAME})"
          elif [ -n "${{ inputs.backfill_dates }}" ]; then
            git commit -m "posts: backfill ${{ inputs.backfill_dates }}"
          else
            git commit -m "posts: $(TZ=America/Phoenix date +%Y-%m-%d)"
          fi
          git push

      # Runs after publishing so a low catalog never blocks a post. Exits
      # non-zero when the angle pool is nearly spent, which surfaces as a failed
      # workflow — the only notification channel this repo has.
      - name: Check angle runway
        run: npm run angles:audit
