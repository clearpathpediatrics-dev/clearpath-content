# ClearPath Content (CPC) — static site, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images can be cached for a year: a changed image gets a new file name.
# Scripts keep their names, so they revalidate on every visit (a cheap 304 when
# unchanged). Under the old blanket "immutable" rule a fix to any script would
# not have reached a returning visitor for up to a year.
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Reach-out funnel -------------------------------------------------------
# Inbound (automatic, no approval needed):
#   submission-created-background  fires on every market-snapshot submission —
#                                  audits, scores, emails them, alerts Dean
#   nurture                        daily 3-touch follow-up, stops on any signal
#
# Outbound (sourced automatically, contacted only after a human approves):
#   prospect-import                receives runs from scripts/prospect-source.mjs
#   dialer                         the call queue UI
#   outbound                       cold sequence — gated on CPC_COLD_FROM_EMAIL
#                                  and CPC_COLD_START_DATE, off unless both set
#
# Required env: RESEND_API_KEY, CPC_ADMIN_TOKEN, CPC_POSTAL_ADDRESS
# Cold email env: CPC_COLD_FROM_EMAIL, CPC_COLD_START_DATE, CPC_COLD_DAILY_MAX
[functions]
  node_bundler = "esbuild"
  # scripts/ holds the shared audit + scoring modules the functions import
  included_files = ["scripts/**", "netlify/lib/**"]

[[headers]]
  for = "/.netlify/functions/unsubscribe"
  [headers.values]
    X-Robots-Tag = "noindex"

# The pipeline surfaces are token-guarded, but keep them out of the index too.
[[headers]]
  for = "/.netlify/functions/dialer"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/.netlify/functions/leads"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
