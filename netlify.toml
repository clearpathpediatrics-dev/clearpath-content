# ClearPath Content (CPC) — static site, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Reach-out funnel -------------------------------------------------------
# submission-created-background fires on every market-snapshot submission:
# audits the site, scores the lead, emails them, alerts Dean, queues follow-up.
# nurture runs daily on a schedule. Both need RESEND_API_KEY.
[functions]
  node_bundler = "esbuild"
  # scripts/ holds the shared audit + scoring modules the functions import
  included_files = ["scripts/**", "netlify/lib/**"]

[[headers]]
  for = "/.netlify/functions/unsubscribe"
  [headers.values]
    X-Robots-Tag = "noindex"
